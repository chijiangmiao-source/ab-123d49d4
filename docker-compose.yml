services:
  api:
    build: .
    environment:
      # Port the API listens on inside the container.
      PORT: "8000"
    ports:
      # Host-side port, configurable via the API_HOST_PORT environment
      # variable (defaults to 8000): API_HOST_PORT=9000 docker compose up
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
